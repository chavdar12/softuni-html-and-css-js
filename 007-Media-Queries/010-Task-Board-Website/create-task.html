<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task</title>
    <link href="styles.css" rel="stylesheet">
</head>

<body>
<header>
    <a href="home.html" class="logo">🖹</a>
    <h1>Create Task</h1>
</header>

<aside>
    <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="view-tasks.html">Task Board</a></li>
        <li><a href="create-task.html">Create</a></li>
        <li><a href="#">Search</a></li>
    </ul>
</aside>

<main>
    <form>
        <table>
            <tbody>
            <tr class="title">
                <th><label for="title">Title</label></th>
                <td><input id="title" name="title" type="text"></td>
            </tr>
            <tr class="description">
                <th><label for="description">Description</label></th>
                <td><textarea id="description" name="description" rows="10"></textarea></td>
            </tr>
            <tr class="board">
                <th><label for="board">Board</label></th>
                <td>
                    <select id="board" name="board">
                        <option>Open</option>
                        <option>In Progress</option>
                        <option>Done</option>
                    </select>
                </td>
            </tr>
            </tbody>
        </table>
        <button type="submit">Create</button>
    </form>
</main>

<footer>
    <div>© 2021 - Task Board</div>
</footer>
</body>
</html>
